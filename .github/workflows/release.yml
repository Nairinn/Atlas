name: Images

on:
  # Pushes to main do not build images directly: this workflow waits for
  # the CI run on that same commit to finish, then builds. The old
  # `claude/**` branch trigger is gone too — it pushed `latest` images
  # from commits that had passed nothing.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  # Pull requests build every image but push none. Nothing else in CI runs
  # the Dockerfiles, so without this a broken one is only discovered at
  # deploy time.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # SLSA provenance signs attestations with the OIDC token; the
  # workflow_run gate reads the CI run's conclusion.
  id-token: write
  actions: read

env:
  REGISTRY: ghcr.io

jobs:
  # Proceed only when CI actually passed and tested the commit main
  # points at NOW — a race where main moved between CI starting and
  # Images starting must not push images for an untested commit. Tag
  # pushes and PRs (which push nothing) pass through: tags are cut only
  # from commits whose CI run already passed.
  gate:
    name: Gate on CI result
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_sha == github.sha)
    steps:
      - run: 'echo "proceeding (event: ${{ github.event_name }})"'

  images:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: gate
    strategy:
      # One broken image should not hide the state of the other eight.
      fail-fast: false
      matrix:
        # One shared Dockerfile per language (docker/rust.Dockerfile,
        # docker/jvm.Dockerfile); the matrix picks the package/jar.
        # extra_apt is empty except where rdkafka needs cmake.
        include:
          - name: migrator
            dockerfile: docker/rust.Dockerfile
            package: atlas-migrator
            bin: atlas-migrate
            extra_apt: ""
          - name: gateway
            dockerfile: docker/rust.Dockerfile
            package: atlas-gateway
            bin: atlas-gateway
            extra_apt: ""
          - name: control-plane
            dockerfile: docker/rust.Dockerfile
            package: atlas-control-plane
            bin: atlas-control-plane
            extra_apt: ""
          - name: auth-service
            dockerfile: docker/jvm.Dockerfile
            dir: services/auth-service
            task: services:auth-service
            jar: auth-service
          - name: geo-engine
            dockerfile: docker/rust.Dockerfile
            package: atlas-geo-engine
            bin: atlas-geo-engine
            extra_apt: cmake
          - name: payments-service
            dockerfile: docker/jvm.Dockerfile
            dir: services/payments-service
            task: services:payments-service
            jar: payments-service
          - name: location-consumer
            dockerfile: docker/rust.Dockerfile
            package: atlas-location-consumer
            bin: atlas-location-consumer
            extra_apt: cmake
          - name: safety-consumer
            dockerfile: docker/rust.Dockerfile
            package: atlas-safety-consumer
            bin: atlas-safety-consumer
            extra_apt: cmake
          - name: fare-consumer
            dockerfile: docker/jvm.Dockerfile
            dir: consumers/fare-consumer
            task: consumers:fare-consumer
            jar: fare-consumer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3.10.2

      # Skipped on pull requests: a fork PR has no package-write token, and
      # nothing is being pushed anyway.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v5.6.1
        with:
          # GHCR paths must be lowercase and github.repository_owner keeps
          # the account's original casing ("Nairinn"). metadata-action
          # lowercases the image name itself, which is the only reason this
          # works without an explicit conversion.
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/atlas-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6.9.0
        with:
          # Every Dockerfile in this repo COPYs from the repo root: the Rust
          # ones because Cargo workspace member paths are relative to it,
          # the Kotlin ones because the Gradle build and protobuf plugin
          # read from $rootDir. So the context is always ".".
          context: .
          file: ${{ matrix.dockerfile }}
          # Args absent from a matrix entry resolve to empty strings;
          # each Dockerfile ignores the other language's args.
          build-args: |
            PACKAGE=${{ matrix.package }}
            BIN=${{ matrix.bin }}
            EXTRA_APT=${{ matrix.extra_apt }}
            DIR=${{ matrix.dir }}
            TASK=${{ matrix.task }}
            JAR=${{ matrix.jar }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance + SBOM attestations: the pushed digest then
          # proves which commit and dependency set produced it. Off on
          # PRs — nothing is pushed, so there is nothing to attest.
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          # Layer cache in GHA storage, scoped per image so the nine builds
          # do not evict each other.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # A single gate the branch protection rule can require, instead of nine.
  images-complete:
    name: All images built
    runs-on: ubuntu-latest
    needs: images
    if: always()
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.images.result }}" != "success" ]; then
            echo "one or more image builds failed"
            exit 1
          fi
          echo "all images built"
