apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: atlas
  labels:
    app.kubernetes.io/name: auth-service
spec:
  # Headless is deliberate. gRPC multiplexes every request over one long
  # HTTP/2 connection, so a normal ClusterIP would pin each client to a
  # single backend pod and the load would not spread. A headless Service
  # gives clients all pod IPs so their gRPC load balancer can do its job.
  clusterIP: None
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: http
      port: 8051
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: atlas
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8051"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-service
          image: ghcr.io/nairinn/atlas-auth-service:latest
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8051
          env:
            - name: GRPC_PORT
              value: "50051"
            - name: HTTP_PORT
              value: "8051"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: atlas-secrets, key: auth-db-url }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: atlas-secrets, key: jwt-secret }
            # Names the active key in every new token's `kid` header.
            # Bump it in lockstep with jwt-secret when rotating; see the
            # rotation table in the README.
            - name: JWT_KEY_ID
              valueFrom:
                secretKeyRef: { name: atlas-secrets, key: jwt-key-id }
            # `kid:secret,...` for keys that no longer sign but must still
            # verify. Optional: absent means no rotation is in flight, and
            # it must be emptied again once one completes — a retired key
            # left in place indefinitely can still verify everything it
            # ever signed.
            - name: JWT_RETIRED_KEYS
              valueFrom:
                secretKeyRef:
                  name: atlas-secrets
                  key: jwt-retired-keys
                  optional: true
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef: { name: atlas-config, key: KAFKA_BROKERS }
          # The service registers grpc.health.v1.Health at startup, so
          # these are real checks rather than "is the port open".
          startupProbe:
            grpc: { port: 50051 }
            # The JVM plus a Postgres pool takes a while; allow 60s before
            # calling it a failed start, without slowing the steady-state
            # liveness probe down to match.
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            grpc: { port: 50051 }
            periodSeconds: 5
          livenessProbe:
            grpc: { port: 50051 }
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              # bcrypt at cost 12 is memory-hungry by design and this is a
              # JVM; 512Mi is a floor, not a guess.
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: the JVM still needs somewhere to write.
        - name: tmp
          emptyDir: {}
      # Give in-flight gRPC calls time to finish before SIGKILL.
      terminationGracePeriodSeconds: 30
