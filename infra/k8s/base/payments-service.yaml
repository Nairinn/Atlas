apiVersion: v1
kind: Service
metadata:
  name: payments-service
  namespace: atlas
  labels:
    app.kubernetes.io/name: payments-service
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: payments-service
  ports:
    - name: grpc
      port: 50053
      targetPort: grpc
    - name: http
      port: 8053
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service
  namespace: atlas
  labels:
    app.kubernetes.io/name: payments-service
    app.kubernetes.io/component: backend
spec:
  # Two replicas is safe despite the outbox dispatcher running in every
  # pod: the dispatcher claims rows with FOR UPDATE SKIP LOCKED inside a
  # transaction, so concurrent drainers split the work rather than
  # double-publishing.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8053"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-schema
          image: ghcr.io/nairinn/atlas-migrator:latest
          args: ["status", "--check"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: atlas-secrets, key: payments-db-url }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: payments-service
          image: ghcr.io/nairinn/atlas-payments-service:latest
          ports:
            - name: grpc
              containerPort: 50053
            - name: http
              containerPort: 8053
          env:
            - name: GRPC_PORT
              value: "50053"
            - name: HTTP_PORT
              value: "8053"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: atlas-secrets, key: payments-db-url }
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef: { name: atlas-config, key: KAFKA_BROKERS }
            - name: KAFKA_TOPIC_FARE_EVENTS
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: KAFKA_TOPIC_FARE_EVENTS
          startupProbe:
            grpc: { port: 50053 }
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            grpc: { port: 50053 }
            periodSeconds: 5
          livenessProbe:
            grpc: { port: 50053 }
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # Longer than the others: a pod terminating mid-drain should be
      # allowed to finish the batch it has already claimed, rather than
      # leaving those rows locked until the transaction times out.
      terminationGracePeriodSeconds: 45
