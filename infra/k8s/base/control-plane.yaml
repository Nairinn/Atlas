# Backend for the `atlas` CLI and the dashboard.
#
# Reachable from outside the cluster, but on a separate hostname from the
# gateway (see ingress.yaml): this is an operator surface, not a data-plane
# one, and it is worth being able to firewall the two independently.
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: atlas
  labels:
    app.kubernetes.io/name: control-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: control-plane
  ports:
    - name: http
      port: 8081
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: atlas
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/component: control
spec:
  # Two, not three: this serves CLI invocations, not user traffic. It is
  # sized for availability during a rollout rather than for throughput.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: ghcr.io/nairinn/atlas-control-plane:latest
          ports:
            - name: http
              containerPort: 8081
            - name: metrics
              containerPort: 9090
          env:
            - name: HTTP_ADDR
              value: "0.0.0.0:8081"
            - name: METRICS_ADDR
              value: "0.0.0.0:9090"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: atlas-secrets, key: control-db-url }
            # Probed live by `atlas status`.
            - name: AUTH_SERVICE_ADDR
              valueFrom:
                configMapKeyRef: { name: atlas-config, key: AUTH_SERVICE_ADDR }
            - name: GEO_ENGINE_ADDR
              valueFrom:
                configMapKeyRef: { name: atlas-config, key: GEO_ENGINE_ADDR }
            - name: PAYMENTS_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: PAYMENTS_SERVICE_ADDR
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef: { name: atlas-config, key: KAFKA_BROKERS }
            - name: GATEWAY_METRICS_URL
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: GATEWAY_METRICS_URL
            # Exactly one proxy sits in front (ingress-nginx), so the
            # client address is the last X-Forwarded-For entry. Leaving this
            # at 0 would key every unauthenticated request by the ingress
            # controller's pod IP — one shared bucket for the whole
            # internet, throttling all users together while doing nothing
            # about any individual attacker.
            - name: TRUSTED_PROXY_HOPS
              value: "1"
            - name: RATE_LIMIT_PER_MINUTE
              value: "120"
            - name: RATE_LIMIT_SIGNUP_PER_MINUTE
              value: "3"
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef: { name: atlas-config, key: RUST_LOG }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 15
          # Unlike the gateway, this readiness probe really does check
          # Postgres: every route here reads or writes the control schema,
          # so a replica that cannot reach the database has nothing to
          # offer and should leave the endpoint list.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      terminationGracePeriodSeconds: 30
