apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: atlas

resources:
  - namespace.yaml
  - config.yaml
  # secrets.example.yaml is deliberately NOT listed. It holds placeholder
  # values and exists as documentation; applying it would create a Secret
  # containing the literal string REPLACE_ME.
  - migrate-job.yaml
  - auth-service.yaml
  - geo-engine.yaml
  - payments-service.yaml
  - gateway.yaml
  - control-plane.yaml
  - consumers.yaml
  - autoscaling.yaml
  - network-policy.yaml
  - ingress.yaml
  # Strimzi KafkaTopic CRDs. replicas defaults to 1 (dev); the prod overlay
  # raises it to 3 with min.insync.replicas=2.
  - kafka-topics.yaml
  # The monitoring objects are CRDs from Google Managed Prometheus
  # (Rules, PodMonitoring, Alertmanager), enabled by the Terraform. On a
  # cluster without GMP, applying fails with "no matches for kind"; the
  # alerts are still worth keeping in the repo, because a rule file that
  # lives in a monitoring team's separate config drifts from the metric
  # names it references within a release or two.
  - monitoring/alerts.yaml
  - monitoring/pod-monitoring.yaml
  - monitoring/alertmanager.yaml

# `labels` rather than the deprecated `commonLabels`. includeSelectors is
# false on purpose: adding a label to every Deployment's selector would
# change an immutable field on any existing Deployment.
labels:
  - pairs:
      app.kubernetes.io/part-of: atlas
    includeSelectors: false


# NOTE — image tags are NOT pinned here.
#
# The manifests' inline tags say `latest`, which is fine for a dev cluster
# and wrong for production: `latest` is a moving pointer, so a pod restart
# can silently change which build is running. The prod overlay documents
# the deploy step that pins `sha-<commit>` tags before apply.

# NOTE — the migration Job needs a delete before re-apply.
#
# A Job's `spec.template` is immutable. Re-applying `atlas-migrate` after
# the image tag changes is rejected by the API server with
# "field is immutable", so `kubectl apply -k` alone cannot roll a new
# migration image out.
#
# Kustomize cannot fix this on its own: `generatorOptions` name hashing
# applies to configMapGenerator and secretGenerator, not to arbitrary
# resources like this Job. The deploy pipeline must delete it first:
#
#   kubectl -n atlas delete job atlas-migrate --ignore-not-found
#   kubectl apply -k infra/k8s/overlays/prod
#   kubectl -n atlas wait --for=condition=complete job/atlas-migrate --timeout=5m
#
# Deleting a completed Job is safe — the migration history lives in
# Postgres, not in the Job object.
