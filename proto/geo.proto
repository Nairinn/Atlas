syntax = "proto3";

package atlas.geo;

service GeoEngine {
  rpc UpdateLocation(LocationUpdate) returns (LocationAck);
  rpc GetNearby(NearbyRequest) returns (NearbyResponse);
  rpc ScoreRoute(RouteScoreRequest) returns (RouteScoreResponse);
  rpc TriggerGeofenceCheck(GeofenceCheckRequest) returns (GeofenceCheckResponse);

  // Phase 3: developer-facing geofence CRUD. Geofences are owned by a
  // user_id; what the developer does with them (alerting, gating routes,
  // pickup zones, etc.) is the developer's choice.
  rpc CreateGeofence(CreateGeofenceRequest) returns (Geofence);
  rpc ListGeofences(ListGeofencesRequest) returns (ListGeofencesResponse);
  rpc DeleteGeofence(DeleteGeofenceRequest) returns (DeleteGeofenceResponse);

  // Safety: a user's judgement about one place. These are what
  // `NearbyUser.safety_score` and `ScoreRoute` are computed from — before
  // this RPC existed there was no way to produce safety data at all, and
  // both returned the neutral 1500.
  rpc CastSafetyVote(SafetyVoteRequest) returns (SafetyVoteResponse);
}

// `project_id` on every request below is injected by the gateway from the
// caller's `X-Atlas-Key`, exactly as `user_id` is injected from the JWT.
// No REST DTO has a field for either, so a caller can name neither — it
// can only present credentials that name them.
message LocationUpdate {
  string user_id = 1;
  double lat = 2;
  double lng = 3;
  int64  recorded_at = 4;
  string project_id = 5;
}

message LocationAck { bool ok = 1; }

enum Role {
  // proto3's zero value: an unset field and an unrecognized one both land
  // here, which is exactly the label the metric wants.
  ROLE_UNKNOWN = 0;
  DRIVER = 1;
  WALKER = 2;
}

message NearbyRequest {
  string requester_user_id = 1;
  double lat = 2;
  double lng = 3;
  double radius_m = 4;
  Role role = 5;
  // 0 means default 20, max 100. Enforced in the service layer.
  uint32 limit = 6;
  string project_id = 7;
}

message NearbyUser {
  string user_id = 1;
  double lat = 2;
  double lng = 3;
  double distance_m = 4;
  // Bayesian-smoothed net sentiment over safety votes near this position,
  // in 1000..2000, neutral 1500. See geo.safety_score in migration 0060 —
  // and note it is deliberately NOT ELO, which needs pairwise outcomes.
  double safety_score = 5;
  // Distinct voters behind that score. 1500 from no votes and 1500 from a
  // hundred evenly split ones are different facts, and a client that
  // cannot tell them apart will present the first as if it were the
  // second.
  int64 safety_vote_count = 6;
}

message NearbyResponse { repeated NearbyUser users = 1; }

// `user_id` is reserved: nothing ever read it (route scoring is per
// project, not per user), and an unused identity field on an internal
// RPC is an invitation to trust it someday.
message RouteScoreRequest {
  reserved 1;
  reserved "user_id";
  repeated RouteCandidate candidates = 2;
  string project_id = 3;
}

message RouteCandidate {
  string route_id = 1;
  repeated LatLng points = 2;
}

message LatLng { double lat = 1; double lng = 2; }

message RouteScoreResponse {
  string best_route_id = 1;
  double score = 2;
  repeated ScoredRoute all_scores = 3;
}

message ScoredRoute {
  string route_id = 1;
  double score = 2;
  // Distinct voters behind the score. With none, `score` is the neutral
  // 1500 and comparing two routes on it is comparing two defaults.
  int64 vote_count = 3;
}

message GeofenceCheckRequest {
  string user_id = 1;
  double lat = 2;
  double lng = 3;
  string project_id = 4;
}

message GeofenceCheckResponse {
  bool triggered = 1;
  repeated string geofence_ids = 2;
}

// --- Geofence CRUD (Phase 3) ------------------------------------------------

message Geofence {
  string id = 1;
  string user_id = 2;
  string label = 3;       // empty string means no label
  double center_lat = 4;
  double center_lng = 5;
  double radius_m = 6;
  bool   active = 7;
  int64  created_at = 8;  // unix epoch seconds
}

message CreateGeofenceRequest {
  string user_id = 1;
  string label = 2;       // empty string = NULL in DB
  double center_lat = 3;
  double center_lng = 4;
  double radius_m = 5;
  string project_id = 6;
}

message ListGeofencesRequest {
  string user_id = 1;
  bool active_only = 2;
  string project_id = 3;
}

message ListGeofencesResponse {
  repeated Geofence geofences = 1;
}

message DeleteGeofenceRequest {
  string geofence_id = 1;
  // Both required, and both injected rather than client-supplied.
  //
  // This message used to carry a bare geofence_id with no owner at all,
  // which meant anyone who could guess or observe a fence id could delete
  // someone else's — the deletion query had nothing to check it against.
  // Scoping the UPDATE by (project_id, user_id, id) makes another user's
  // fence indistinguishable from one that does not exist.
  string user_id = 2;
  string project_id = 3;
}

message DeleteGeofenceResponse {
  bool deleted = 1;
}

// --- Safety votes -----------------------------------------------------------

message SafetyVoteRequest {
  string user_id = 1;
  double lat = 2;
  double lng = 3;
  Verdict verdict = 4;
  string project_id = 5;

  // An enum rather than a free string: "safe" / "Safe" / "SAFE" arriving
  // from three different SDKs and being counted as three verdicts is the
  // sort of bug that only shows up in the aggregate.
  enum Verdict {
    VERDICT_UNKNOWN = 0;
    SAFE = 1;
    UNSAFE = 2;
  }
}

message SafetyVoteResponse {
  // The area's score after this vote, so a client can show the effect
  // without a second round trip.
  double safety_score = 1;
  // How many distinct users have voted in the area, including this one.
  // A score means very different things at 3 voters and at 300.
  int64 vote_count = 2;
}
