syntax = "proto3";

package atlas.payments;

option java_multiple_files = true;
option java_package = "atlas.payments";

service PaymentsService {
  // Add funds to a wallet from an external payment method. This is the only
  // way money enters the platform: wallets start at zero and settlement
  // refuses to move funds a wallet does not hold.
  rpc Deposit(DepositRequest) returns (DepositResponse);

  rpc InitiateTransaction(TransactionRequest) returns (TransactionResponse);
  rpc SettleTransaction(SettleRequest) returns (SettleResponse);
  rpc GetWalletBalance(WalletRequest) returns (WalletResponse);
  rpc RefundTransaction(RefundRequest) returns (RefundResponse);

  // Connect onboarding: create (or resume) a Stripe Express account for
  // the caller and hand back the hosted onboarding URL the app must send
  // them to. Safe to expose through the gateway for the same reason
  // Deposit is: the account created is the token subject's, so a caller
  // can only ever onboard themselves as a payee.
  rpc CreateConnectAccount(CreateConnectAccountRequest) returns (CreateConnectAccountResponse);

  // The caller's own payout account: whether it exists and whether
  // Stripe has finished onboarding it (payouts_enabled). A transaction
  // whose payee has no usable account fails at authorize time, so the app
  // needs this to know when to stop showing the "add payout account"
  // screen.
  rpc GetConnectAccount(GetConnectAccountRequest) returns (GetConnectAccountResponse);

  // Internal: forces an immediate outbox drain pass and returns the number of
  // rows dispatched. The dispatcher also runs on a timer; this is for tests
  // and ops that want a deterministic flush. Not exposed through the gateway.
  rpc DrainOutbox(DrainOutboxRequest) returns (DrainOutboxResponse);
}

// `project_id` on every request below is injected by the gateway from the
// caller's `X-Atlas-Key`, or carried on the Kafka event for the RPCs the
// fare-consumer calls. It is never client-supplied.
//
// It matters most on idempotency_key lookups: the unique index is
// (project_id, idempotency_key), so a lookup by key alone could match
// another tenant's transaction and hand it back as a successful
// idempotent replay.
message DepositRequest {
  string user_id         = 1;
  int64  amount_cents    = 2;
  string idempotency_key = 3;
  string project_id      = 4;
}

message DepositResponse {
  string transaction_id = 1;
  string status         = 2;
  // Wallet balance after the deposit, so the caller does not need a second
  // round trip to render the result.
  int64  balance_cents  = 3;
}

message TransactionRequest {
  string from_user_id   = 1;
  string to_user_id     = 2;
  int64  amount_cents   = 3;
  string idempotency_key = 4;
  string ride_id        = 5;
  string project_id     = 6;
  // The tenant's cut of the fare, in cents, taken out of amount_cents (the
  // Connect application_fee). 0 means no fee. Injected by the gateway from
  // project configuration is the future plan; for now the caller's project
  // settings own it — either way it is bounded by amount_cents in the
  // service.
  int64  application_fee_cents = 7;
}

message TransactionResponse {
  string transaction_id = 1;
  string status = 2;
  // The PaymentIntent's client_secret when the provider uses client-side
  // confirmation (D1): the app's client presents it to the processor's
  // client SDK to complete the payment; the server only captures. Empty
  // for providers without that flow.
  string client_secret = 3;
}

message SettleRequest  { string transaction_id = 1; string project_id = 2; }
message SettleResponse { bool success = 1; string status = 2; }

message WalletRequest  { string user_id = 1; string project_id = 2; }
message WalletResponse { int64 balance_cents = 1; string currency = 2; }

message RefundRequest  { string transaction_id = 1; string project_id = 2; }
message RefundResponse { bool success = 1; }

message DrainOutboxRequest  { uint32 max_rows = 1; }   // 0 => default 100
message DrainOutboxResponse { uint32 rows_dispatched = 1; }

message CreateConnectAccountRequest {
  string user_id = 1;
  string project_id = 2;
  // Where Stripe should return the user after onboarding completes.
  string return_url = 3;
}
message CreateConnectAccountResponse {
  // The hosted onboarding URL. Single-use and short-lived; the app must
  // send the user to it immediately.
  string onboarding_url = 1;
}

message GetConnectAccountRequest {
  string user_id = 1;
  string project_id = 2;
}
message GetConnectAccountResponse {
  bool   exists = 1;
  bool   payouts_enabled = 2;
}
