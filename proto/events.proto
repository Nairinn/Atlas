syntax = "proto3";

package atlas.events;

option java_multiple_files = true;
option java_package = "atlas.events";

// Payload schemas for every Kafka topic. Producers and consumers across
// Rust and Kotlin services must encode/decode using these definitions.
//
// Topic -> message mapping:
//   atlas.location.updates -> LocationUpdateEvent
//   atlas.fare.events      -> FareEvent
//   atlas.auth.tokens      -> AuthTokenEvent
//   atlas.safety.alerts    -> SafetyAlertEvent
//   atlas.elo.recompute    -> EloRecomputeEvent

// Every event carries the project it happened in.
//
// Consumers act on these asynchronously, long after the request that
// produced them has gone, so they cannot re-derive the tenant from a
// header or a token — it has to travel with the event. Without it a
// consumer's only options are to guess or to query unscoped, and the
// second one looks like it works.
message LocationUpdateEvent {
  string user_id = 1;
  double lat = 2;
  double lng = 3;
  int64  recorded_at = 4; // unix epoch seconds
  string project_id = 5;
}

message FareEvent {
  string ride_id = 1;
  string transaction_id = 2; // empty until payments creates one
  EventType event_type = 3;
  int64  amount_cents = 4;
  int64  occurred_at = 5;
  string project_id = 6;

  enum EventType {
    UNKNOWN = 0;
    RIDE_ACCEPTED = 1;     // pre-authorize fare
    RIDE_COMPLETED = 2;    // settle
    RIDE_CANCELLED = 3;    // void a PENDING transaction, refund a SETTLED one
    TRANSACTION_SETTLED = 4;
    TRANSACTION_REFUNDED = 5;
    TRANSACTION_CANCELLED = 6;  // hold voided before capture; no money moved
  }
}

message AuthTokenEvent {
  string user_id = 1;
  string token_hash = 2; // sha256 hex of the JWT, never the raw token
  string session_id = 3;
  EventType event_type = 4;
  int64  occurred_at = 5;
  string project_id = 6;

  enum EventType {
    UNKNOWN = 0;
    ISSUED = 1;
    REVOKED = 2;
  }
}

message SafetyAlertEvent {
  string user_id = 1;
  string geofence_id = 2;
  AlertType alert_type = 3;
  int64  triggered_at = 4;
  string project_id = 5;

  enum AlertType {
    UNKNOWN = 0;
    GEOFENCE_ENTERED = 1;
    GEOFENCE_EXITED = 2;
  }
}

message EloRecomputeEvent {
  repeated string segment_ids = 1;
  TriggerType trigger_type = 2;
  int64  occurred_at = 3;
  string project_id = 4;

  enum TriggerType {
    UNKNOWN = 0;
    NIGHTLY_BATCH = 1;
    NEW_VOTE = 2;
    MANUAL = 3;
  }
}
