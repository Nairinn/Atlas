[package]
name = "atlas-control-plane"
version = "0.1.0"
edition = "2021"
description = "Control plane for the Atlas platform: project provisioning, API keys, status, and audit logs for the atlas CLI and dashboard."
license = "MIT"

[[bin]]
name = "atlas-control-plane"
path = "src/main.rs"

[dependencies]
atlas-edge = { workspace = true }
atlas-keys = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
governor = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
# Status checks: gRPC health probes against the backends, and an HTTP
# scrape of the gateway's Prometheus endpoint.
tonic = { workspace = true }
tonic-health = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
