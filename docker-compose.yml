# Local Atlas dev environment. Every phase is now wired up:
#   infrastructure  -> postgres, zookeeper, kafka
#   schema          -> migrator (runs once, then exits)
#   services        -> auth-service, geo-engine, payments-service,
#                      gateway (public edge), control-plane (CLI backend)
#   consumers       -> location, safety, fare
#
# Usage:
#   docker compose up -d                     # the whole platform
#   docker compose logs -f migrator          # watch the schema apply
#   docker compose run --rm migrator status  # what is applied vs pending
#   psql postgres://atlas:atlas_dev@localhost:5432/atlas -c '\dn'
#
# Ports published to the host: 8080 gateway, 8081 control-plane,
# 5432 postgres, 9092 kafka, 50051-50053 gRPC, 9091+ metrics.

services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      # migrations/ is deliberately NOT mounted at /docker-entrypoint-initdb.d
      # any more. That directory runs on a database's FIRST BOOT ONLY, so any
      # migration added later was silently skipped by everyone who already had
      # a volume, and there was no way at all to apply a schema change to a
      # running database. The `migrator` service below owns schema now.
      - atlas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Phase 8: migrations ---------------------------------------------------
  # Runs to completion and exits. Every service that touches Postgres waits
  # for it with `condition: service_completed_successfully`, so no service
  # ever starts against a half-migrated schema.
  #
  # If you have a volume from before this existed, its schema was applied by
  # the old initdb path and has no migration history. Adopt it once with:
  #
  #   docker compose run --rm migrator baseline --through 40 \
  #       --i-understand-this-skips-sql
  #
  # Or just start clean: docker compose down -v
  migrator:
    build:
      context: .
      dockerfile: tools/migrator/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://atlas:atlas_dev@postgres:5432/atlas
      RUST_LOG: info
    restart: "no"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # --- Phase 2: auth-service (Kotlin/gRPC) ----------------------------------
  auth-service:
    build:
      # Build context is the repo root so the Dockerfile can pull files from
      # both /proto and /services/auth-service. Phase 2A's commented stanza
      # used `./services/auth-service` as context which would not have worked
      # once the protobuf-gradle-plugin started reading from $rootDir/proto.
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "50051:50051"
      - "8051:8051"   # /metrics + /healthz; never publish this in prod
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
      kafka: { condition: service_started }
    environment:
      # Names the active signing key. Rotation adds JWT_RETIRED_KEYS
      # alongside it — see the rotation table in the README.
      JWT_KEY_ID: "k1"
      # Development only. auth-service refuses to start without this,
      # because its only email implementation LOGS messages instead of
      # sending them — which puts password reset tokens in the log. Never
      # set it in a deployed environment; wire a real provider there.
      ATLAS_ALLOW_LOGGING_EMAIL: "true"
      DATABASE_URL: postgres://atlas:atlas_dev@postgres:5432/atlas
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: dev_secret_change_in_prod_dev_secret_change_in_prod
      GRPC_PORT: "50051"
      HTTP_PORT: "8051"

  # --- Phase 3: geo-engine (Rust) -------------------------------------------
  geo-engine:
    # The Dockerfile COPYs the whole workspace because rdkafka and the
    # proto build need files outside services/geo-engine. Build context
    # must therefore be the repo root.
    build:
      context: .
      dockerfile: services/geo-engine/Dockerfile
    ports:
      - "50052:50052"
      - "9091:9090"  # host 9091 -> container 9090 to avoid a clash later
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
      kafka: { condition: service_started }
    environment:
      DATABASE_URL: postgres://atlas:atlas_dev@postgres:5432/atlas
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_LOCATION_UPDATES: atlas.location.updates
      GRPC_ADDR: 0.0.0.0:50052
      METRICS_ADDR: 0.0.0.0:9090
      RUST_LOG: info,atlas_geo_engine=debug

  # --- Phase 4: payments-service (Kotlin/Ktor) ------------------------------
  payments-service:
    # Build context is the repo root so the Dockerfile can pull files from both
    # /proto and /services/payments-service (the protobuf-gradle-plugin reads
    # from $rootDir/proto). gRPC on 50053; HTTP (/metrics + webhooks) on 8053.
    build:
      context: .
      dockerfile: services/payments-service/Dockerfile
    ports:
      - "50053:50053"
      - "8053:8053"
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
      kafka: { condition: service_started }
    environment:
      DATABASE_URL: postgres://atlas:***@postgres:5432/atlas
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_FARE_EVENTS: atlas.fare.events
      GRPC_PORT: "50053"
      HTTP_PORT: "8053"
      # The default provider for projects with no Stripe row. Per-project
      # overrides live in control.project_payment_config.
      PAYMENT_PROVIDER: "fake"
      # Uncomment to enable Stripe for projects configured with a
      # control.project_payment_config row. Generate with:
      #   openssl rand -hex 32
      # PAYMENT_CONFIG_ENC_KEY: "<32-byte hex or base64>"
      # Point the Stripe adapter at stripe-mock instead of api.stripe.com:
      # STRIPE_API_BASE: "http://host.docker.internal:12111"

  # --- Phase 5: gateway (Rust/Axum) -----------------------------------------
  # The only service that should ever be published to the outside world.
  # Build context is the repo root: it is a Cargo workspace member and its
  # build.rs reads the .proto files from /proto.
  #
  # depends_on uses service_started, not service_healthy: the gateway's
  # upstream channels are lazy by design (see services/gateway/src/state.rs)
  # so it comes up regardless and returns 503 per-request until a backend
  # is actually answering.
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8080:8080"
      # host 9093 -> container 9090. 9090 is free but 9091 is geo-engine's
      # and 9092 is Kafka's, so 9093 is the next non-colliding port.
      - "9093:9090"
    depends_on:
      auth-service: { condition: service_started }
      geo-engine: { condition: service_started }
      payments-service: { condition: service_started }
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      METRICS_ADDR: 0.0.0.0:9090
      AUTH_SERVICE_ADDR: http://auth-service:50051
      GEO_ENGINE_ADDR: http://geo-engine:50052
      PAYMENTS_SERVICE_ADDR: http://payments-service:50053
      # Read-only: resolves the X-Atlas-Key header to a project. The pool
      # is lazy like the gRPC channels, so the gateway still starts and
      # answers health probes with Postgres down.
      DATABASE_URL: postgres://atlas:atlas_dev@postgres:5432/atlas
      # Also the key revocation window — see services/gateway/src/tenant.rs.
      PROJECT_CACHE_TTL_SECONDS: "30"
      # No proxy in front locally, so the socket peer address is the client.
      TRUSTED_PROXY_HOPS: "0"
      RUST_LOG: info,atlas_gateway=debug

  # --- Phase 6: consumers ---------------------------------------------------
  # None of these are published to the host except their metrics ports.
  # They are pure background workers: no inbound API, no gRPC server.
  #
  # All three use service_started rather than service_healthy for Kafka
  # because each retries internally — a consumer that cannot reach the
  # broker yet logs and retries rather than dying.

  # Owns the geo.locations retention window (migration 0020's TTL).
  location-consumer:
    build:
      context: .
      dockerfile: consumers/location-consumer/Dockerfile
    ports:
      - "9094:9090"
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
      kafka: { condition: service_started }
    environment:
      DATABASE_URL: postgres://atlas:atlas_dev@postgres:5432/atlas
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_LOCATION_UPDATES: atlas.location.updates
      CONSUMER_GROUP: atlas-location-consumer
      METRICS_ADDR: 0.0.0.0:9090
      SWEEP_INTERVAL_SECONDS: "300"
      RUST_LOG: info,atlas_location_consumer=debug

  # Turns location pings into geofence entry/exit alerts. This is the only
  # producer of atlas.safety.alerts.
  safety-consumer:
    build:
      context: .
      dockerfile: consumers/safety-consumer/Dockerfile
    ports:
      - "9095:9090"
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
      kafka: { condition: service_started }
    environment:
      DATABASE_URL: postgres://atlas:atlas_dev@postgres:5432/atlas
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_LOCATION_UPDATES: atlas.location.updates
      KAFKA_TOPIC_SAFETY_ALERTS: atlas.safety.alerts
      CONSUMER_GROUP: atlas-safety-consumer
      METRICS_ADDR: 0.0.0.0:9090
      RUST_LOG: info,atlas_safety_consumer=debug

  # Drives settlement off ride lifecycle events. Depends on payments-service
  # because it settles and refunds over gRPC rather than touching wallets.
  fare-consumer:
    build:
      context: .
      dockerfile: consumers/fare-consumer/Dockerfile
    ports:
      - "8054:8054"
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
      kafka: { condition: service_started }
      payments-service: { condition: service_started }
    environment:
      DATABASE_URL: postgres://atlas:atlas_dev@postgres:5432/atlas
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_FARE_EVENTS: atlas.fare.events
      CONSUMER_GROUP: atlas-fare-consumer
      # host:port, not a URL — this is a gRPC channel target.
      PAYMENTS_SERVICE_TARGET: payments-service:50053
      HTTP_PORT: "8054"

  # --- Phase 7: control-plane (Rust/Axum) -----------------------------------
  # Backend the developer CLI and dashboard talk to: account bootstrap,
  # project provisioning, API keys, status, and the audit trail.
  #
  # 8081 is not arbitrary: cli/src/api.rs defaults to
  # http://localhost:8081/v1, so `atlas deploy --live` finds this with no
  # --base-url flag.
  #
  # Build context is the repo root (Cargo workspace member).
  control-plane:
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    ports:
      - "8081:8081"
      - "9096:9090"  # host 9096 -> container 9090; 9090-9095 are taken
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
      kafka: { condition: service_started }
    environment:
      HTTP_ADDR: 0.0.0.0:8081
      METRICS_ADDR: 0.0.0.0:9090
      DATABASE_URL: postgres://atlas:atlas_dev@postgres:5432/atlas
      # Probed by `atlas status`. These are gRPC health checks, so the
      # addresses are the services' gRPC ports, not their HTTP ones.
      AUTH_SERVICE_ADDR: http://auth-service:50051
      GEO_ENGINE_ADDR: http://geo-engine:50052
      PAYMENTS_SERVICE_ADDR: http://payments-service:50053
      # `events` has no gRPC health service; its health is a TCP connect
      # against the broker.
      KAFKA_BROKERS: kafka:29092
      # Real request counts and latency quantiles come from the gateway's
      # Prometheus endpoint — the only place per-request data exists.
      GATEWAY_METRICS_URL: http://gateway:9090/metrics
      TRUSTED_PROXY_HOPS: "0"
      RUST_LOG: info,atlas_control_plane=debug

volumes:
  atlas_pg_data:
